<mat-card class="case-library-card">
  <mat-card-header>
    <mat-card-title>实验案例库</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <div class="library-copy">
      <div>
        <div class="library-title">引导式工作流程</div>
        <p class="library-subtitle">{{ guidance.headline }}</p>
      </div>
      <div class="phase-chip" [class.running]="guidance.phase === 'running'" [class.verified]="guidance.phase === 'verified'">
        {{ guidance.phase | titlecase }}
      </div>
    </div>

    <div class="step-rail">
      <div *ngFor="let label of phaseLabels; let index = index" class="step-item" [class.active]="index <= guidance.activeStep">
        <span>{{ index + 1 }}</span>
        <small>{{ label }}</small>
      </div>
    </div>

    <div class="case-grid">
      <button *ngFor="let item of cases" class="case-card" [class.active]="isActive(item.id)" (click)="loadCase.emit(item.id)">
        <div class="case-topline">
          <strong>{{ item.title }}</strong>
          <span>{{ item.algorithmName }}</span>
        </div>
        <p>{{ item.summary }}</p>
        <div class="case-meta">{{ item.datasetName }} · {{ item.category }}</div>
        <div class="case-checks">
          <div *ngFor="let objective of item.objectives">{{ objective }}</div>
        </div>
      </button>
    </div>

    <div class="validation-box" *ngIf="activeCaseId">
      <div class="validation-title">验证目标</div>
      <p>{{ getValidationText() }}</p>
    </div>
  </mat-card-content>
</mat-card>
