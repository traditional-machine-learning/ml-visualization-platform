<mat-card class="canvas-card">
  <mat-card-header>
    <mat-card-title>
      <span class="title-text">可视化画布</span>

      <span class="axis-pickers" *ngIf="dataset && !isPcaView">
        <mat-form-field class="axis-picker" appearance="outline" subscriptSizing="dynamic">
          <mat-label>X 轴</mat-label>
          <mat-select [value]="selectedXName"
                      [disabled]="!pickersEnabled"
                      (selectionChange)="onAxisChange('x', $event.value)">
            <mat-option *ngFor="let dim of axisOptions"
                        [value]="dim.name"
                        [disabled]="dim.name === selectedYName">
              {{ dim.displayName || dim.name }}
            </mat-option>
          </mat-select>
        </mat-form-field>

        <mat-form-field class="axis-picker" appearance="outline" subscriptSizing="dynamic">
          <mat-label>Y 轴</mat-label>
          <mat-select [value]="selectedYName"
                      [disabled]="!pickersEnabled"
                      (selectionChange)="onAxisChange('y', $event.value)">
            <mat-option *ngFor="let dim of axisOptions"
                        [value]="dim.name"
                        [disabled]="dim.name === selectedXName">
              {{ dim.displayName || dim.name }}
            </mat-option>
          </mat-select>
        </mat-form-field>
      </span>

      <button mat-stroked-button class="view-toggle" *ngIf="pca3DAvailable" (click)="togglePca3d()">
        <mat-icon>{{ pca3dMode ? 'grid_on' : 'view_in_ar' }}</mat-icon>
        {{ pca3dMode ? '切回 2D' : '切换 3D' }}
      </button>
    </mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <div *ngIf="dataset; else emptyState" class="canvas-wrapper">
      <div class="axis-hint" *ngIf="projectionNote">
        <mat-icon class="axis-hint-icon">info</mat-icon>
        <span>{{ projectionNote }}</span>
      </div>

      <div class="axis-hint" *ngIf="isPcaView">
        <mat-icon class="axis-hint-icon">insights</mat-icon>
        <span>
          已把数据投影到 {{ pcaDimensions }} 个主成分上，散点按原始类别着色{{ pca3DAvailable ? '；可切换到 3D 视图拖拽旋转观察' : '' }}。
        </span>
      </div>

      <div class="chart-area" [class.chart-area-3d]="pca3dMode">
        <div #chartHost class="chart-frame" *ngIf="!pca3dMode"></div>

        <div class="pca3d-frame" *ngIf="pca3dMode">
          <canvas #pca3dHost
                  class="pca3d-canvas"
                  (pointerdown)="onPca3dPointerDown($event)"
                  (pointermove)="onPca3dPointerMove($event)"
                  (pointerup)="onPca3dPointerUp()"
                  (pointerleave)="onPca3dPointerUp()"></canvas>
          <div class="pca3d-hint">
            <span>按住拖拽可旋转视角</span>
            <button mat-button class="pca3d-reset" (click)="resetPca3dView()">重置视角</button>
          </div>
        </div>

        <div #importanceHost class="importance-frame" *ngIf="trainingState?.modelData?.featureImportances?.length"></div>
      </div>

      <div class="legend" *ngIf="dataset.dataPoints && dataset.dataPoints.length > 0">
        <div class="legend-title">点图例</div>
        <div *ngFor="let feature of getUniqueLabels()" class="legend-item">
          <span class="legend-color" [style.backgroundColor]="getLegendColor(feature)"></span>
          <span class="legend-label">{{ feature }}</span>
        </div>
      </div>
    </div>

    <ng-template #emptyState>
      <div class="empty-canvas">
        <mat-icon class="empty-icon">scatter_plot</mat-icon>
        <p class="empty-text">选择数据集以预览可视化区域。</p>
      </div>
    </ng-template>

    <div *ngIf="trainingState?.status === 'training'" class="training-indicator">
      <mat-spinner diameter="20"></mat-spinner>
      <span>训练正在进行...</span>
    </div>
  </mat-card-content>
</mat-card>
