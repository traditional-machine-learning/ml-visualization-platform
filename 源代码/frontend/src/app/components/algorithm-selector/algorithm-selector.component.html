<mat-card class="algorithm-selector-card">
  <mat-card-header>
    <mat-card-title>选择算法</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <div *ngIf="isLoading" class="loading-container">
      <mat-spinner diameter="30"></mat-spinner>
    </div>

    <div *ngIf="!isLoading" class="algorithm-list">
      <mat-card *ngFor="let algorithm of algorithms"
                class="algorithm-item"
                [class.selected]="isSelected(algorithm)"
                (click)="algorithm.id > 0 && onSelect(algorithm)"
                [class.disabled]="algorithm.id <= 0">
        <mat-card-content>
          <div class="algorithm-name">{{ algorithm.displayName }}</div>
          <div class="algorithm-type">{{ algorithm.type }}</div>
          <div class="algorithm-desc">{{ algorithm.description }}</div>
        </mat-card-content>
      </mat-card>

      <div *ngIf="algorithms.length === 0" class="empty-message">暂无可用算法。</div>
    </div>
  </mat-card-content>
</mat-card>
