<mat-card class="training-log-card">
  <mat-card-header>
    <mat-card-title>Training Log</mat-card-title>
    <span class="status-dot" [class.running]="status === 'training'" [class.done]="status === 'completed'"></span>
  </mat-card-header>

  <mat-card-content>
    <div class="log-stream" *ngIf="entries.length > 0; else emptyLog">
      <div class="log-entry" *ngFor="let entry of entries" [class.success]="entry.tone === 'success'" [class.warning]="entry.tone === 'warning'">
        <span class="log-step">S{{ entry.step }}</span>
        <span class="log-text">{{ entry.text }}</span>
      </div>
    </div>

    <ng-template #emptyLog>
      <p class="empty-log">Load a case and start training to see step-by-step guidance.</p>
    </ng-template>
  </mat-card-content>
</mat-card>
