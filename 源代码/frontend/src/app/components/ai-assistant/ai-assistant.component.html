<div class="ai-assistant-container" [class.minimized]="isMinimized">
  <div class="ai-header" (click)="toggleMinimize()">
    <mat-icon>smart_toy</mat-icon>
    <span class="ai-title">AI助手</span>
    <mat-icon class="toggle-icon">{{ isMinimized ? 'expand_less' : 'expand_more' }}</mat-icon>
  </div>

  <div class="ai-body" *ngIf="!isMinimized">
    <div class="messages-container">
      <div class="message" *ngFor="let message of messages"
           [class.user-message]="message.type === 'user'"
           [class.ai-message]="message.type === 'ai'">
        <div class="message-header">
          <mat-icon>{{ message.type === 'user' ? 'person' : 'smart_toy' }}</mat-icon>
          <span>{{ message.type === 'user' ? '你' : 'AI' }}</span>
        </div>
        <div class="message-content">{{ message.content }}</div>
        <div class="message-context" *ngIf="message.contextInfo">
          {{ message.contextInfo }}
        </div>
      </div>

      <div class="loading-indicator" *ngIf="isLoading">
        <mat-spinner diameter="20"></mat-spinner>
        <span>正在思考...</span>
      </div>
    </div>

    <div class="input-area">
      <mat-form-field appearance="outline" class="question-input">
        <input matInput
               [(ngModel)]="currentQuestion"
               placeholder="输入问题..."
               (keyup.enter)="sendQuestion()">
      </mat-form-field>
      <button mat-mini-fab color="primary"
              (click)="sendQuestion()"
              [disabled]="!currentQuestion.trim() || isLoading">
        <mat-icon>send</mat-icon>
      </button>
    </div>

    <button mat-stroked-button class="clear-btn" (click)="clearChat()">
      清空对话
    </button>
  </div>
</div>
