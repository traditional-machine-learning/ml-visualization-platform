<mat-card class="explanation-card">
  <mat-card-header>
    <mat-card-title>模型解释</mat-card-title>
  </mat-card-header>
  <mat-card-content *ngIf="explanation; else emptyState">
    <div class="explanation-header">
      <div>
        <div class="explanation-title">{{ explanation.title }}</div>
        <p class="explanation-description">{{ explanation.description }}</p>
      </div>
      <div class="algorithm-chip" *ngIf="algorithm">{{ algorithm.displayName }}</div>
    </div>

    <div *ngIf="explanation.mode === 'tree'" class="tree-panel">
      <svg viewBox="0 0 380 300" class="tree-svg">
        <g *ngFor="let edge of explanation.treeEdges">
          <line
            class="tree-edge"
            [attr.x1]="getNodeX(edge.from) + 42"
            [attr.y1]="getNodeY(edge.from) + 42"
            [attr.x2]="getNodeX(edge.to) + 42"
            [attr.y2]="getNodeY(edge.to) + 42"></line>
        </g>
        <g *ngFor="let node of explanation.treeNodes">
          <foreignObject [attr.x]="node.x" [attr.y]="node.y" width="100" height="90">
            <div class="tree-node" [class.cyan]="node.tone === 'cyan'" [class.purple]="node.tone === 'purple'" [class.green]="node.tone === 'green'">
              <strong>{{ node.label }}</strong>
              <span>{{ node.detail }}</span>
            </div>
          </foreignObject>
        </g>
      </svg>
    </div>

    <div *ngIf="explanation.mode === 'weights'" class="weights-panel">
      <div *ngFor="let weight of explanation.weights" class="weight-row">
        <div class="weight-label">{{ weight.feature }}</div>
        <div class="weight-bar-track">
          <div class="weight-bar" [class.negative]="weight.value < 0" [style.width.%]="getWeightWidth(weight.value)"></div>
        </div>
        <div class="weight-value">{{ weight.value | number:'1.2-2' }}</div>
      </div>
    </div>

    <div *ngIf="explanation.mode === 'summary'" class="summary-panel">
      <div class="summary-note" *ngFor="let note of explanation.notes">{{ note }}</div>
    </div>

    <div class="note-stack">
      <div class="note-title">解释说明</div>
      <div class="note-item" *ngFor="let note of explanation.notes">{{ note }}</div>
    </div>
  </mat-card-content>

  <ng-template #emptyState>
    <mat-card-content>
      <p class="empty-text">选择算法并开始训练以解锁解释视图。</p>
    </mat-card-content>
  </ng-template>
</mat-card>
