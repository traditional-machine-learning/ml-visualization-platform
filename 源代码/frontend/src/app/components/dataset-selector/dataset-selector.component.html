<mat-card class="dataset-selector-card">
  <mat-card-header>
    <mat-card-title>选择数据集</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <div *ngIf="isLoading" class="loading-container">
      <mat-spinner diameter="30"></mat-spinner>
    </div>

    <div *ngIf="!isLoading" class="dataset-list">
      <mat-card *ngFor="let dataset of datasets"
                class="dataset-item"
                [class.selected]="isSelected(dataset)"
                (click)="onSelect(dataset)">
        <mat-card-content>
          <div class="dataset-name">{{ dataset.name }}</div>
          <div class="dataset-info">
            <span>{{ dataset.sampleCount }} 个样本</span>
            <span>{{ dataset.featureCount }} 个特征</span>
          </div>
          <div class="dataset-desc">{{ dataset.description }}</div>
        </mat-card-content>
      </mat-card>

      <div *ngIf="datasets.length === 0" class="empty-message">暂无可用数据集。</div>

      <mat-divider></mat-divider>
      <div class="upload-section">
        <p class="upload-label">上传小型CSV数据集</p>
        <input type="file" accept=".csv" #fileInput (change)="onFileUpload(fileInput)" />
      </div>
    </div>
  </mat-card-content>
</mat-card>
