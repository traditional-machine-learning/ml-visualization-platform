server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: ml-platform-backend

  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      continue-on-error: true

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://mysql:3306/ml_platform?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=UTF-8
    username: root
    password: 22302010009Fyr

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.mlplatform.model
  configuration:
    map-underscore-to-camel-case: true

# 内置数据集自动填充：真实数据集启动时下载完整 CSV，合成数据集程序生成
dataset-seed:
  enabled: true
  timeout-seconds: 30
  # 代理可选：留空则自动尝试容器环境变量 DATASET_SEED_PROXY / HTTPS_PROXY / http_proxy
  proxy-host: ""
  proxy-port: 0
  remote-sources:
    - name: iris
      url: https://raw.githubusercontent.com/mwaskom/seaborn-data/master/iris.csv
      expected-samples: 150
    - name: boston_housing
      url: https://raw.githubusercontent.com/selva86/datasets/master/BostonHousing.csv
      expected-samples: 506
  synthetic-samples:
    make_classification: 100
    make_blobs: 150

logging:
  level:
    com.mlplatform: DEBUG
    org.springframework: INFO

llm:
  api-key: sk-BYbT02LK6xgoKl5ftp8xLQ
  endpoint: https://llmapi.paratera.com
  model: GLM-4.5-Flash
  max-tokens: 1000
